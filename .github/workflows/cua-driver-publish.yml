name: Publish pi-computer-use Cua Driver

on:
  workflow_dispatch: {}
  workflow_call: {}
  push:
    branches: [master]
    paths:
      - "packages/pi-computer-use/driver-release.json"
      - "packages/pi-computer-use/scripts/fetch-driver.mjs"
      - "packages/pi-computer-use/platforms/**"
      - ".github/workflows/cua-driver-publish.yml"

permissions:
  contents: read

concurrency:
  group: cua-driver-publish
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: check
        run: |
          missing=false
          driver_version="$(node -p "require('./packages/pi-computer-use/driver-release.json').version")"
          for dir in packages/pi-computer-use/platforms/cua-driver-*; do
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            package_driver_version="$(node -p "require('./${dir}/package.json').cuaDriverVersion")"
            if [ "$package_driver_version" != "$driver_version" ]; then
              echo "${name} declares Cua Driver ${package_driver_version}, expected ${driver_version}."
              exit 1
            fi
            if published_driver_version="$(npm view "${name}@${version}" cuaDriverVersion 2>/dev/null)"; then
              if [ "$published_driver_version" != "$driver_version" ]; then
                echo "${name}@${version} contains Cua Driver ${published_driver_version:-unknown}; bump the platform package version."
                exit 1
              fi
              echo "already on npm: ${name}@${version}"
            else
              echo "to publish: ${name}@${version}"
              missing=true
            fi
          done
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.missing == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-universal
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-22.04
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch verified upstream runtime
        shell: bash
        run: node packages/pi-computer-use/scripts/fetch-driver.mjs ${{ matrix.target }}
      - name: Verify runtime
        shell: bash
        run: |
          dir="packages/pi-computer-use/platforms/cua-driver-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            darwin-universal)
              bin="$dir/bin/CuaDriver.app/Contents/MacOS/cua-driver"
              version="$(node -p "require('./packages/pi-computer-use/driver-release.json').version")"
              codesign --verify --deep --strict "$dir/bin/CuaDriver.app"
              lipo -archs "$bin" | grep -q arm64
              lipo -archs "$bin" | grep -q x86_64
              [ "$(plutil -extract CFBundleShortVersionString raw "$dir/bin/CuaDriver.app/Contents/Info.plist")" = "$version" ]
              [ "$(plutil -extract CFBundleVersion raw "$dir/bin/CuaDriver.app/Contents/Info.plist")" = "$version" ]
              ;;
            win32-*) bin="$dir/bin/cua-driver.exe" ;;
            *) bin="$dir/bin/cua-driver" ;;
          esac
          "$bin" --version | grep -F "$(node -p "require('./packages/pi-computer-use/driver-release.json').version")"
          "$bin" list-tools | grep -F 'get_window_state:'
          npm pack "$dir" --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        with:
          name: cua-driver-${{ matrix.target }}
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.missing == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cua-driver-*
          path: .release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not configured."
            exit 1
          fi
          for archive in .release-artifacts/*.tgz; do
            metadata="$(tar -xOf "$archive" package/package.json)"
            name="$(PACKAGE_JSON="$metadata" node -p 'JSON.parse(process.env.PACKAGE_JSON).name')"
            version="$(PACKAGE_JSON="$metadata" node -p 'JSON.parse(process.env.PACKAGE_JSON).version')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version} (already on npm)"
            else
              npm publish "$archive" --access public
            fi
          done
