name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: biomejs/setup-biome@v2
      - run: biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Isolate temporary files
        run: |
          job_tmp="$RUNNER_TEMP/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test"
          mkdir -p "$job_tmp"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
          install-video-tools: 'true'
      - run: pnpm --filter @amaster.ai/pi-storage prisma:generate
      - run: pnpm --filter @amaster.ai/pi-shared build
      - run: pnpm test
      - name: Check registered tool errors on Pi 0.79.1 and current Pi
        run: |
          pnpm --filter @amaster.ai/pi-channels build
          rpc_case_dir="$(mktemp -d)"
          trap 'rm -rf -- "$rpc_case_dir"' EXIT
          npm install --prefix "$rpc_case_dir" --ignore-scripts --no-audit --no-fund --no-save \
            @earendil-works/pi-coding-agent@0.79.1 @earendil-works/pi-agent-core@0.79.1
          node tests/eval/rpc-tool-errors.mjs \
            "$rpc_case_dir/node_modules/@earendil-works/pi-coding-agent" \
            packages/pi-channels/node_modules/@earendil-works/pi-coding-agent

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pi-build
      - run: pnpm build
