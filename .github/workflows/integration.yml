name: Integration

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-extension-matrix:
    name: Detect extension E2E matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_extensions: ${{ steps.select.outputs.has_extensions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select changed extension scenarios
        id: select
        env:
          INTEGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          INTEGRATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/integration-matrix.mjs

  # ──────────────────────────────────────────────────────────────────────
  # Stage A: pi runtime can install + load every extension in this monorepo.
  # No LLM calls — keeps this job fast (<2min) so downstream jobs (Stage B
  # smoke, Stage C matrix) can start as soon as the load contract is verified.
  # ──────────────────────────────────────────────────────────────────────
  pi-runtime:
    name: Pi runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_INTEGRATION_BASE_URL: ${{ secrets.PI_INTEGRATION_BASE_URL }}
      PI_INTEGRATION_API_KEY: ${{ secrets.PI_INTEGRATION_API_KEY }}
      PI_OFFLINE: '0'

    steps:
      - uses: actions/checkout@v7
      - name: Setup pi build environment
        uses: ./.github/actions/setup-pi-build
        with:
          set-pi-agent-dir: 'true'
          install-pi-cli: 'true'

      - name: Verify pi installation
        run: pi --version

      - name: Install all monorepo extensions into pi (Stage A — load)
        run: |
          set -euo pipefail
          for pkg in packages/pi-*; do
            echo "::group::pi install $pkg"
            pi install "./$pkg"
            echo "::endgroup::"
          done

      - name: Assert all packages are registered (Stage A — assert)
        run: |
          set -euo pipefail
          installed="$(pi list)"
          echo "$installed"
          missing=0
          for pkg in packages/pi-*; do
            name="$(basename "$pkg")"
            if ! grep -F "/packages/${name}" <<<"$installed" >/dev/null; then
              echo "::error::Missing registration for ${name} in 'pi list' output"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} extension(s) failed to register"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────
  # Stage B: single-prompt LLM smoke test against the custom deepseek
  # provider. This job runs in parallel with the Stage C matrix (both
  # `needs: pi-runtime` and don't depend on each other) so the LLM
  # round-trip doesn't gate per-extension verification.
  # ──────────────────────────────────────────────────────────────────────
  pi-runtime-smoke:
    name: Pi runtime smoke (Stage B)
    needs: pi-runtime
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PI_INTEGRATION_BASE_URL: ${{ secrets.PI_INTEGRATION_BASE_URL }}
      PI_INTEGRATION_API_KEY: ${{ secrets.PI_INTEGRATION_API_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      PI_OFFLINE: '0'

    steps:
      - uses: actions/checkout@v7
      - name: Setup pi build environment
        uses: ./.github/actions/setup-pi-build
        with:
          set-pi-agent-dir: 'true'
          install-pi-cli: 'true'

      - name: Configure custom deepseek provider in ~/.pi/agent/models.json
        if: env.PI_INTEGRATION_BASE_URL != '' && env.PI_INTEGRATION_API_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          cat > "$PI_CODING_AGENT_DIR/models.json" <<EOF
          {
            "providers": {
              "deepseek-integration": {
                "baseUrl": "${PI_INTEGRATION_BASE_URL}",
                "api": "openai-completions",
                "apiKey": "\$PI_INTEGRATION_API_KEY",
                "authHeader": true,
                "models": [
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "contextWindow": 1000000,
                    "maxTokens": 384000,
                    "thinkingLevelMap": {
                      "minimal": null,
                      "low": null,
                      "medium": null,
                      "high": "high",
                      "xhigh": "max"
                    },
                    "compat": {
                      "thinkingFormat": "deepseek",
                      "requiresReasoningContentOnAssistantMessages": true,
                      "supportsDeveloperRole": false
                    }
                  }
                ]
              }
            }
          }
          EOF
          cat > "$PI_CODING_AGENT_DIR/settings.json" <<EOF
          {
            "pi-telemetry": {
              "serviceName": "pi-telemetry-ci",
              "includePayloads": true,
              "langfuse": {
                "enabled": true,
                "publicKey": "\${LANGFUSE_PUBLIC_KEY}",
                "secretKey": "\${LANGFUSE_SECRET_KEY}",
                "baseUrl": "\${LANGFUSE_BASE_URL}"
              }
            }
          }
          EOF
          pi install "./packages/pi-telemetry"

      - name: Verify provider is registered
        if: env.PI_INTEGRATION_BASE_URL != '' && env.PI_INTEGRATION_API_KEY != ''
        run: |
          set -euo pipefail
          pi --list-models deepseek-integration | tee /tmp/pi-models.txt
          grep -F 'deepseek-integration' /tmp/pi-models.txt
          grep -F 'deepseek-v4-flash' /tmp/pi-models.txt

      - name: Run single-prompt smoke test (Stage B)
        if: env.PI_INTEGRATION_BASE_URL != '' && env.PI_INTEGRATION_API_KEY != ''
        run: |
          set -euo pipefail
          # pi's undici EnvHttpProxyAgent reads HTTP_PROXY/HTTPS_PROXY at
          # startup; an empty string crashes `new URL("")`. Unset entirely.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY
          unset http_proxy https_proxy all_proxy no_proxy
          set +e
          output="$(pi \
            --provider deepseek-integration \
            --model deepseek-v4-flash \
            --thinking xhigh \
            --no-session \
            --no-context-files \
            --mode text \
            -p 'Reply with the single word READY and nothing else.' 2>&1)"
          rc=$?
          set -e
          echo "--- pi output (exit=$rc) ---"
          echo "$output"
          echo "----------------------------"
          if [ $rc -ne 0 ] || ! grep -qi 'READY' <<<"$output"; then
            echo "::error::Expected 'READY' in pi output (exit=$rc)"
            exit 1
          fi

      - name: Skipped — Stage B (secrets unavailable)
        if: env.PI_INTEGRATION_BASE_URL == '' || env.PI_INTEGRATION_API_KEY == ''
        run: |
          echo "::warning::PI_INTEGRATION_BASE_URL or PI_INTEGRATION_API_KEY secret not set — skipping Stage B."

  # ──────────────────────────────────────────────────────────────────────
  # Stage C: per-extension E2E. Most entries constrain the LLM to a tiny tool
  # allowlist and assert the tool result; pi-video-gen uses RPC commands
  # instead so local composition never needs a model call.
  #
  # Skipped on fork PRs because GitHub does not expose repository secrets to
  # pull_request workflows from forks. The secret-free selector and Stage A
  # still run for those PRs. Each matrix job duplicates Stage A setup because
  # jobs don't share workspace state.
  # ──────────────────────────────────────────────────────────────────────
  extension-tool-matrix:
    name: Extension E2E (${{ matrix.extension }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}${{ matrix.scenario && format('-{0}', matrix.scenario) || '' }})
    needs: [detect-extension-matrix, pi-runtime]
    if: >
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.detect-extension-matrix.outputs.has_extensions == 'true' &&
      vars.PI_INTEGRATION_SKIP_STAGE_C != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-extension-matrix.outputs.matrix) }}
    env:
      PI_INTEGRATION_BASE_URL: ${{ secrets.PI_INTEGRATION_BASE_URL }}
      PI_INTEGRATION_API_KEY: ${{ secrets.PI_INTEGRATION_API_KEY }}
      PI_INTEGRATION_MULTICA_TOKEN: ${{ secrets.PI_INTEGRATION_MULTICA_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      UNSPLASH_TOKEN: ${{ secrets.UNSPLASH_TOKEN }}
      BROWSERLESS_TOKEN: ${{ secrets.BROWSERLESS_TOKEN }}
      # LANGFUSE_* remains step-scoped to commands that start pi.
      PI_OFFLINE: '0'

    steps:
      - name: Isolate temporary files
        run: |
          job_tmp="$RUNNER_TEMP/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-extension-${{ strategy.job-index }}"
          mkdir -p "$job_tmp"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - name: Setup pi build environment
        uses: ./.github/actions/setup-pi-build
        with:
          set-pi-agent-dir: 'true'
          install-pi-cli: 'true'
          install-video-tools: ${{ matrix.extension == 'pi-video-gen' && 'true' || 'false' }}
          # pi-memory job loads pi-memory-mem0 which needs better-sqlite3's
          # native binding for its OSS vector store. We rebuild for every
          # matrix entry because conditional `if:` on composite-action steps
          # is fine but routing per-extension setup is noisier than just
          # running a cheap prebuild-install across the board.
          prebuild-better-sqlite3: 'true'

      - name: Configure pi settings (provider, models, extensions)
        if: >
          matrix.extension == 'pi-video-gen' ||
          (env.PI_INTEGRATION_BASE_URL != '' &&
          env.PI_INTEGRATION_API_KEY != '')
        run: |
          set -euo pipefail
          if [ "${{ matrix.extension }}" = "pi-video-gen" ] &&
             { [ -z "${PI_INTEGRATION_BASE_URL:-}" ] || [ -z "${PI_INTEGRATION_API_KEY:-}" ]; }; then
            echo "::error::PI_INTEGRATION_BASE_URL and PI_INTEGRATION_API_KEY are required for pi-video-gen provider configuration."
            exit 1
          fi
          mkdir -p "$PI_CODING_AGENT_DIR"

          # pi-web-access settings vary by matrix `provider`: DeepSeek search
          # reuses the integration gateway, DashScope search rides the same
          # gateway with an explicit qwen3.8-max model, while Firecrawl and
          # Unsplash configure their own API keys. Keys are expanded by pi at
          # runtime.
          # (Single-quoted heredoc-var: placeholders like ${FIRECRAWL_API_KEY}
          # stay literal — bash does not recursively expand a variable's
          # contents, so pi's own ${ENV_VAR} resolver sees them verbatim.)
          if [ "${{ matrix.provider }}" = "deepseek" ]; then
            WEB_ACCESS_SETTINGS='{
              "search": { "provider": "deepseek" },
              "fetch": {
                "summary": {
                  "provider": "deepseek-integration",
                  "model": "deepseek-v4-flash"
                }
              },
              "providers": {
                "deepseek": {
                  "baseUrl": "${PI_INTEGRATION_BASE_URL}",
                  "apiKey": "${PI_INTEGRATION_API_KEY}"
                }
              }
            }'
          elif [ "${{ matrix.provider }}" = "dashscope" ]; then
            WEB_ACCESS_SETTINGS='{
              "search": { "provider": "dashscope" },
              "providers": {
                "dashscope": {
                  "baseUrl": "${PI_INTEGRATION_BASE_URL}",
                  "apiKey": "${PI_INTEGRATION_API_KEY}",
                  "model": "qwen3.8-max"
                }
              }
            }'
          elif [ "${{ matrix.provider }}" = "unsplash" ]; then
            WEB_ACCESS_SETTINGS='{
              "imageSearch": { "provider": "unsplash" },
              "providers": {
                "unsplash": { "apiKey": "${UNSPLASH_TOKEN}" }
              }
            }'
          elif [ "${{ matrix.provider }}" = "firecrawl" ]; then
            WEB_ACCESS_SETTINGS='{
              "search": { "provider": "firecrawl" },
              "fetch": {
                "provider": "firecrawl",
                "summary": {
                  "provider": "deepseek-integration",
                  "model": "deepseek-v4-flash"
                }
              },
              "providers": {
                "firecrawl": { "apiKey": "${FIRECRAWL_API_KEY}" }
              }
            }'
          else
            WEB_ACCESS_SETTINGS='{
              "fetch": {
                "summary": {
                  "provider": "deepseek-integration",
                  "model": "deepseek-v4-flash"
                }
              }
            }'
          fi


          # pi-image-gen defaultModel varies by matrix `provider`: the
          # seedream-lite entry points at the Seedream 5.0 lite model id,
          # everything else uses qwen-image-2.0. Both fall through to the
          # ci-gateway catch-all customProvider (no ARK/DASHSCOPE key in CI),
          # so the id is sent verbatim as the remote model id over the
          # OpenAI-shaped wire. Use the full versioned id (not the alias) so
          # the gateway receives the exact remote model name.
          if [ "${{ matrix.provider }}" = "seedream-lite" ]; then
            IMAGE_GEN_MODEL="doubao-seedream-5-0-lite-260128"
          else
            IMAGE_GEN_MODEL="qwen-image-2.0"
          fi

          # NOTE on ordering: this step writes settings.json BEFORE the
          # `pi install` step below. `pi install` appends to settings.json's
          # `packages` array; if we wrote settings.json after install, the
          # packages array would be clobbered and the matrix prompt would
          # run against zero registered extensions while still constraining
          # tools to a name that no longer exists — pi hangs in that state.

          # 1. models.json — the integration gateway custom provider used by
          #    every matrix entry. DeepSeek remains the main model; the browser
          #    vision tool uses Kimi K2.6 because DeepSeek cannot accept images.
          cat > "$PI_CODING_AGENT_DIR/models.json" <<EOF
          {
            "providers": {
              "deepseek-integration": {
                "baseUrl": "${PI_INTEGRATION_BASE_URL}",
                "api": "openai-completions",
                "apiKey": "\$PI_INTEGRATION_API_KEY",
                "authHeader": true,
                "models": [
                  {
                    "id": "deepseek-v4-flash",
                    "name": "DeepSeek V4 Flash",
                    "reasoning": true,
                    "input": ["text"],
                    "contextWindow": 1000000,
                    "maxTokens": 384000,
                    "thinkingLevelMap": {
                      "minimal": null,
                      "low": null,
                      "medium": null,
                      "high": "high",
                      "xhigh": "max"
                    },
                    "compat": {
                      "thinkingFormat": "deepseek",
                      "requiresReasoningContentOnAssistantMessages": true,
                      "supportsDeveloperRole": false
                    }
                  },
                  {
                    "id": "kimi-k2.6",
                    "name": "Kimi K2.6",
                    "reasoning": true,
                    "input": ["text", "image"],
                    "contextWindow": 262144,
                    "maxTokens": 262144,
                    "compat": {
                      "supportsStore": false,
                      "supportsDeveloperRole": false,
                      "supportsReasoningEffort": false,
                      "maxTokensField": "max_tokens",
                      "supportsStrictMode": false,
                      "thinkingFormat": "deepseek"
                    }
                  }
                ]
              }
            }
          }
          EOF

          # 2. settings.json — extension-specific configuration. Every matrix
          #    entry carries any keys it needs; absent extensions ignore them.
          #    pi-memory-mem0's historyDbPath MUST stay on the per-job temp dir:
          #    concurrent better-sqlite3 writers on one shared file segfault
          #    the pi process (exit 139), so nothing may point at a default
          #    location like ~/.pi/agent/memories/.
          # ${LANGFUSE_*} stays literal for pi's settings resolver. Every
          # model-backed matrix leg installs pi-telemetry below.
          cat > "$PI_CODING_AGENT_DIR/settings.json" <<EOF
          {
            "pi-teamwork": {
              "provider": "multica",
              "multica": {
                "serverUrl": "https://multica.ai",
                "token": "\${PI_INTEGRATION_MULTICA_TOKEN}",
                "autoInstall": true
              }
            },
            "pi-web-access": ${WEB_ACCESS_SETTINGS},
            "pi-scheduler": {
              "dataDir": "${RUNNER_TEMP}/pi-scheduler"
            },
            "pi-goal": {
              "model": {
                "provider": "deepseek-integration",
                "model": "deepseek-v4-flash"
              },
              "maxIterations": 1,
              "requireConfirmForDerived": false
            },
            "pi-memory-mem0": {
              "mode": "open-source",
              "memoryMode": "hybrid",
              "userId": "ci-integration",
              "oss": {
                "vectorStore": {
                  "provider": "memory",
                  "config": {
                    "dbPath": "${RUNNER_TEMP}/pi-mem0/mem0-vectors.db"
                  }
                },
                "historyDbPath": "${RUNNER_TEMP}/pi-mem0/mem0-history.db",
                "embedder": {
                  "provider": "deepseek-integration",
                  "config": { "model": "text-embedding-v4" }
                },
                "llm": {
                  "provider": "deepseek-integration",
                  "config": { "model": "deepseek-v4-flash" }
                }
              }
            },
            "pi-image-gen": {
              "defaultModel": "${IMAGE_GEN_MODEL}",
              "outputDir": "${RUNNER_TEMP}/pi-images",
              "customProviders": {
                "ci-gateway": {
                  "api": "openai",
                  "baseUrl": "${PI_INTEGRATION_BASE_URL}",
                  "apiKey": "\${PI_INTEGRATION_API_KEY}"
                }
              }
            },
            "pi-video-gen": {
              "defaultModel": "ci-seedance-newapi",
              "outputDir": "${RUNNER_TEMP}/pi-video-gen",
              "customProviders": {
                "ci-gateway": {
                  "api": "newapi",
                  "baseUrl": "\${PI_INTEGRATION_BASE_URL}",
                  "apiKey": "\${PI_INTEGRATION_API_KEY}",
                  "models": [
                    {
                      "id": "doubao-seedance-2-0-260128",
                      "alias": "ci-seedance-newapi"
                    }
                  ]
                }
              }
            },
            "pi-browser-use": {
              "sessionMode": "existing",
              "wsEndpoint": "wss://production-sfo.browserless.io/chrome?token=\${BROWSERLESS_TOKEN}",
              "visionModel": {
                "provider": "deepseek-integration",
                "model": "kimi-k2.6"
              }
            },
            "pi-telemetry": {
              "serviceName": "pi-telemetry-ci",
              "includePayloads": true,
              "langfuse": {
                "enabled": true,
                "publicKey": "\${LANGFUSE_PUBLIC_KEY}",
                "secretKey": "\${LANGFUSE_SECRET_KEY}",
                "baseUrl": "\${LANGFUSE_BASE_URL}"
              }
            }
          }
          EOF
          if [ "${{ matrix.extension }}" = "pi-video-gen" ]; then
            mkdir -p "$RUNNER_TEMP/pi-video-gen-home"
            {
              echo "HOME=$RUNNER_TEMP/pi-video-gen-home"
              echo "PI_AGENT_HOME=$PI_CODING_AGENT_DIR"
            } >> "$GITHUB_ENV"
          fi

      - name: Install monorepo extensions into pi
        run: |
          set -euo pipefail
          # `pi install` appends to ~/.pi/agent/settings.json's `packages`
          # array, so this must run AFTER the settings-write step above (the
          # heredoc would otherwise clobber the array and the matrix prompt
          # would hang against zero registered extensions).
          pi install "./packages/${{ matrix.extension }}"
          if [ "${{ matrix.extension }}" != "pi-telemetry" ]; then
            pi install "./packages/pi-telemetry"
          fi
          if [ "${{ matrix.extension }}" = "pi-memory" ]; then
            pi install "./packages/pi-memory-mem0"
          fi
          pi list

      - name: Verify computer-use daemon follows abrupt owner exit
        if: matrix.extension == 'pi-computer-use'
        run: node tests/computer-use-owner-exit.mjs

      - name: Compose preview video (pi-video-gen only)
        if: matrix.extension == 'pi-video-gen'
        env:
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          export PI_OFFLINE=1
          JOB_DIR="$RUNNER_TEMP/pi-video-gen/preview-promo"
          SPEC_PATH="$JOB_DIR/timeline-input.json"
          PREVIEW_PATH="$GITHUB_WORKSPACE/packages/pi-video-gen/preview.png"
          mkdir -p "$JOB_DIR"

          SPEC_PATH="$SPEC_PATH" PREVIEW_PATH="$PREVIEW_PATH" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const spec = {
            title: 'Pi Video Gen preview promo',
            output: { resolution: '1280x720', fps: 25, codec: 'mpeg4' },
            bgm: null,
            segments: [
              {
                id: 'preview',
                image: process.env.PREVIEW_PATH,
                durationSec: 3,
                motion: 'kenburns-in',
              },
            ],
          };
          await writeFile(process.env.SPEC_PATH, `${JSON.stringify(spec, null, 2)}\n`);
          NODE

          PI_E2E_SPEC="$SPEC_PATH" node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import { createInterface } from 'node:readline';

          const child = spawn(
            'pi',
            [
              '--mode',
              'rpc',
              '--no-session',
              '--no-context-files',
              '--offline',
              '--approve',
            ],
            {
              cwd: process.env.GITHUB_WORKSPACE,
              env: process.env,
              stdio: ['pipe', 'pipe', 'pipe'],
            },
          );
          child.stderr.pipe(process.stderr);

          let doctorOk = false;
          let composeOk = false;
          let failure;
          const timer = setTimeout(() => {
            failure = new Error('Pi RPC video compose E2E timed out');
            child.kill('SIGTERM');
          }, 180_000);
          const lines = createInterface({ input: child.stdout });

          lines.on('line', (line) => {
            process.stdout.write(`${line}\n`);
            let event;
            try {
              event = JSON.parse(line);
            } catch {
              return;
            }
            if (event.type === 'extension_error') {
              failure = new Error(`Extension error: ${event.error}`);
              child.stdin.end();
              return;
            }
            if (event.type === 'extension_ui_request' && event.method === 'notify') {
              const message = String(event.message ?? '');
              doctorOk ||= message.includes('model: doubao-seedance-2-0-260128 [newapi]')
                && message.includes('NewAPI API key configured')
                && message.includes('ffmpeg found')
                && message.includes('ffprobe found');
              composeOk ||= message.includes('Promo video ready:');
            }
            if (event.id === 'doctor' && event.type === 'response') {
              child.stdin.write(`${JSON.stringify({
                id: 'compose',
                type: 'prompt',
                message: `/video-gen compose ${process.env.PI_E2E_SPEC}`,
              })}\n`);
            }
            if (event.id === 'compose' && event.type === 'response') {
              child.stdin.end();
            }
          });

          child.stdin.write(`${JSON.stringify({
            id: 'doctor',
            type: 'prompt',
            message: '/video-gen doctor',
          })}\n`);
          const exitCode = await new Promise((resolve) => {
            child.on('exit', (code) => resolve(code));
          });
          clearTimeout(timer);

          if (failure) throw failure;
          if (exitCode !== 0) throw new Error(`Pi RPC exited ${exitCode}`);
          if (!doctorOk) {
            throw new Error('Doctor did not resolve the NewAPI model, API key, ffmpeg, and ffprobe');
          }
          if (!composeOk) throw new Error('video_compose did not produce the preview promo');
          NODE

          FINAL_VIDEO="$JOB_DIR/final_video.mp4"
          PROBE_JSON="$RUNNER_TEMP/pi-video-gen/probe.json"
          test -s "$FINAL_VIDEO"
          ffprobe \
            -v error \
            -show_entries stream=codec_type,codec_name,width,height \
            -show_entries format=duration \
            -of json \
            "$FINAL_VIDEO" > "$PROBE_JSON"
          cat "$PROBE_JSON"
          PROBE_JSON="$PROBE_JSON" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const probe = JSON.parse(await readFile(process.env.PROBE_JSON, 'utf8'));
          const video = probe.streams?.find((stream) => stream.codec_type === 'video');
          const audio = probe.streams?.find((stream) => stream.codec_type === 'audio');
          const duration = Number(probe.format?.duration);
          if (
            video?.codec_name !== 'mpeg4'
            || video.width !== 1280
            || video.height !== 720
            || audio?.codec_name !== 'aac'
            || duration < 2.5
            || duration > 3.5
          ) {
            throw new Error(`Unexpected preview promo probe: ${JSON.stringify(probe)}`);
          }
          NODE

      - name: Upload preview promo (pi-video-gen only)
        if: matrix.extension == 'pi-video-gen'
        uses: actions/upload-artifact@v7
        with:
          name: pi-video-gen-preview-promo
          path: |
            ${{ runner.temp }}/pi-video-gen/preview-promo/final_video.mp4
            ${{ runner.temp }}/pi-video-gen/preview-promo/qc/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap multica CLI (pi-teamwork only)
        # Install + authenticate the multica CLI up front instead of relying
        # on pi-teamwork's autoInstall at session_start: driving login and the
        # daemon here means the LLM's workspace_list call returns real data
        # instead of `Exit code 1`, cutting the job from ~12min to ~1min.
        if: matrix.extension == 'pi-teamwork'
        env:
          MULTICA_TOKEN: ${{ secrets.PI_INTEGRATION_MULTICA_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          archive="${RUNNER_TEMP}/multica.tar.gz"
          curl -fsSL \
            https://github.com/multica-ai/multica/releases/download/v0.4.15/multica-cli-0.4.15-linux-amd64.tar.gz \
            -o "$archive"
          echo "a7e6db95d24b8fb679c0d46d8756e0a324d5231a249fd1393e9f15a17f80e2aa  $archive" |
            sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.local/bin" multica
          chmod 0755 "$HOME/.local/bin/multica"
          multica --version
          multica config set server_url https://multica.ai
          multica daemon start || true   # tolerate an already-running daemon
          multica login --token "$MULTICA_TOKEN"
          # Smoke-test the auth before handing off to pi-teamwork.
          multica workspace list --output json

      - name: Verify Browserless credentials (pi-browser-use only)
        if: matrix.extension == 'pi-browser-use'
        run: |
          set -euo pipefail
          if [ -z "${BROWSERLESS_TOKEN:-}" ]; then
            echo "::error::BROWSERLESS_TOKEN secret is required for pi-browser-use E2E"
            exit 1
          fi

      - name: Run extension prompt (Stage C)
        if: >
          matrix.extension != 'pi-video-gen' &&
          env.PI_INTEGRATION_BASE_URL != '' &&
          env.PI_INTEGRATION_API_KEY != ''
        env:
          EXTENSION_PROMPT: ${{ matrix.prompt }}
          # Lets pi-memory-mem0 log turns whose extraction stored nothing —
          # the difference between a quiet pipeline and a broken one.
          DEBUG: 'pi-memory-mem0'
          # Every model-backed matrix run loads pi-telemetry and expands these
          # placeholders at runtime.
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          # The firecrawl matrix entry needs a real Firecrawl API key. Skip it
          # cleanly (rather than fail) when the secret isn't configured yet.
          if [ "${{ matrix.provider }}" = "firecrawl" ] && [ -z "${FIRECRAWL_API_KEY:-}" ]; then
            echo "::warning::FIRECRAWL_API_KEY secret unset — skipping Firecrawl E2E."
            exit 0
          fi
          # Same for the unsplash entry: without UNSPLASH_TOKEN the
          # image_search tool never registers, and constraining --tools to a
          # missing tool hangs pi.
          if [ "${{ matrix.provider }}" = "unsplash" ] && [ -z "${UNSPLASH_TOKEN:-}" ]; then
            echo "::warning::UNSPLASH_TOKEN secret unset — skipping Unsplash E2E."
            exit 0
          fi
          # pi-telemetry's assertion happens against the Langfuse API, so this
          # step needs the keys (step-scoped env above). The trace is found by
          # a per-run codeword plus a start-timestamp lower bound.
          if [ "${{ matrix.extension }}" = "pi-telemetry" ]; then
            if [ -z "${LANGFUSE_PUBLIC_KEY:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
              echo "::warning::LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY secrets unset — skipping pi-telemetry E2E."
              exit 0
            fi
            echo "TELEMETRY_TRACE_FROM=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
            # Unique codeword per run so concurrent jobs against the same
            # Langfuse project can't cross-match; the child script and the
            # verify script both read TELEMETRY_CODEWORD from the env.
            SCENARIO="${{ matrix.scenario || 'basic' }}"
            CODEWORD="ci-langfuse-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SCENARIO}"
            export TELEMETRY_CODEWORD="$CODEWORD"
            export PI_TELEMETRY_TRACE_ID="$CODEWORD"
            echo "TELEMETRY_CODEWORD=$CODEWORD" >> "$GITHUB_ENV"
            EXTENSION_PROMPT="${EXTENSION_PROMPT//ci-langfuse-probe/$CODEWORD}"
          fi
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY
          unset http_proxy https_proxy all_proxy no_proxy
          set +e
          # --mode json emits one JSON event per line (session_start, turn_start,
          # tool_execution_start/end, message_end, agent_end, …). We capture
          # the whole stream so the log shows what tools the LLM called, with
          # what args, and what each call returned — including any tool-side
          # errors that text-mode silently summarizes into prose.
          #
          # --thinking high (not xhigh): for DeepSeek, xhigh maps to
          # `reasoning_effort: max`, which on the amaster gateway has been
          # observed to occasionally hang >5min on tool-call prompts. Stage B
          # smoke keeps xhigh per the original spec.
          if [ "${{ matrix.extension }}" = "pi-goal" ]; then
            # pi-goal has no LLM tool. --goal '' enables auto-derivation; -p
            # drives one real agent run (print mode won't run a turn without a
            # prompt). The task is a plain file write; pi-goal derives a goal
            # from it at before_agent_start and evaluates at agent_end. Restrict
            # to the write tool for predictability.
            output="$(pi \
              --provider deepseek-integration \
              --model deepseek-v4-flash \
              --thinking high \
              --no-session \
              --no-context-files \
              --tools '${{ matrix.tools }}' \
              --mode json \
              --goal '' \
              -p "$EXTENSION_PROMPT" 2>&1)"
            rc=$?
          else
            output="$(pi \
              --provider deepseek-integration \
              --model deepseek-v4-flash \
              --thinking high \
              --no-session \
              --no-context-files \
              --tools '${{ matrix.tools }}' \
              --mode json \
              -p "$EXTENSION_PROMPT" 2>&1)"
            rc=$?
          fi
          set -e
          echo "--- raw event stream (${{ matrix.extension }}, exit=$rc) ---"
          echo "$output"
          echo "----------------------------"
          if [ $rc -ne 0 ]; then
            echo "::error::pi exited non-zero ($rc) for ${{ matrix.extension }}"
            exit 1
          fi
          # The stream can carry non-JSON stderr lines from extensions (e.g.
          # pi-memory-mem0's DEBUG capture diagnostic, enabled step-wide below)
          # — every jq consumption filters to parseable events first, or slurp
          # assertions die with a parse error instead of testing anything.
          EVENTS_JSON="$(jq -R 'fromjson? // empty' <<<"$output" 2>/dev/null || true)"
          # Pretty-print the salient events so failures are diagnosable at a
          # glance. `jq` is preinstalled on the runner image.
          if command -v jq >/dev/null 2>&1; then
            echo "--- tool calls ---"
            jq -rc 'select(.type == "tool_execution_start" or .type == "tool_execution_end") | .' <<<"$EVENTS_JSON" || true
            echo "--- tool errors (isError=true OR result text starts with Error:) ---"
            # Match both proper isError tool results AND tools that smuggle
            # errors into a normal text result (e.g. multica adapter today).
            jq -rc '
              select(.type == "tool_execution_end")
              | select(
                  .isError == true
                  or (
                    (.result.content // []) as $c
                    | any($c[]?; .type == "text" and (.text // "" | startswith("Error:")))
                  )
                )
              | {tool: .toolName, isError: .isError, result: .result}
            ' <<<"$EVENTS_JSON" || true
            echo "--- final assistant text ---"
            ASSISTANT_TEXT=$(jq -rs '
              map(select(.type == "message_end" and .message.role == "assistant") | .message.content[]?
                | select(.type == "text") | .text)
              | join("\n")
            ' <<<"$EVENTS_JSON" 2>/dev/null || echo "")
            echo "$ASSISTANT_TEXT"
            echo "------------------"
          else
            ASSISTANT_TEXT="$output"
          fi
          # Assert: prefer the assistant text (cleanest), fall back to grepping
          # the raw event stream when jq isn't available or didn't extract any
          # text. The raw stream contains tool args/results too, so the
          # pattern still matches when the assistant doesn't quote them back.
          HAYSTACK="${ASSISTANT_TEXT:-$output}"
          [ -z "$HAYSTACK" ] && HAYSTACK="$output"
          # pi-goal is asserted below by the goal engine's diagnostics and a
          # filesystem check, not by grepping assistant text (which would be
          # self-matched by prompt/thinking echo). Visual analysis cases are
          # asserted against the tool result below so line wrapping in the final
          # assistant answer cannot cause a false negative.
          if [ "${{ matrix.extension }}" != "pi-goal" ] && [ "${{ matrix.assert_visual_analysis }}" != "true" ]; then
            if ! grep -qiE '${{ matrix.assert_pattern }}' <<<"$HAYSTACK"; then
              echo "::error::Expected pattern '${{ matrix.assert_pattern }}' not found in ${{ matrix.extension }} output"
              exit 1
            fi
          fi

          # Cases with assert_tool must prove that the expected text came from
          # a successful tool result, not from the prompt or model commentary.
          if [ -n "${{ matrix.assert_tool }}" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required for the tool result assertion"
              exit 1
            fi
            if ! jq -e -s \
              --arg tool '${{ matrix.assert_tool }}' \
              --arg pattern '${{ matrix.assert_tool_pattern || matrix.assert_pattern }}' '
                any(.[];
                  .type == "tool_execution_end"
                  and .toolName == $tool
                  and .isError != true
                  and .result.isError != true
                  and (
                    any((.result.content // [])[]?;
                      .type == "text"
                      and ((.text // "") | test($pattern; "i"))
                    )
                    or ((.result.details // {}) | tostring | test($pattern; "i"))
                  )
                )
              ' <<<"$EVENTS_JSON" >/dev/null; then
              echo "::error::${{ matrix.assert_tool }} did not return '${{ matrix.assert_tool_pattern || matrix.assert_pattern }}' successfully"
              exit 1
            fi
          fi

          if [ -n "${{ matrix.assert_tool_count }}" ]; then
            if ! jq -e -s \
              --arg tool '${{ matrix.assert_tool }}' \
              --argjson expected_count '${{ matrix.assert_tool_count || 0 }}' '
                ([.[] | select(.type == "tool_execution_start" and .toolName == $tool)] | length)
                == $expected_count
              ' <<<"$EVENTS_JSON" >/dev/null; then
              echo "::error::${{ matrix.assert_tool }} was not called exactly ${{ matrix.assert_tool_count }} time(s)"
              exit 1
            fi
          fi

          # Image generation may legitimately override the configured outputDir
          # per tool call. Verify the files reported by the successful tool result
          # instead of assuming they remain under the settings-level directory.
          if [ "${{ matrix.extension }}" = "pi-image-gen" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required for the generated image assertion"
              exit 1
            fi
            IMAGE_PATHS=$(jq -sr '
              [
                .[]
                | select(
                    .type == "tool_execution_end"
                    and .toolName == "image_generate"
                    and .isError != true
                    and .result.isError != true
                  )
                | (.result.details.images // [])[]?.path
                | select(type == "string" and length > 0)
              ]
              | unique[]
            ' <<<"$output")
            if [ -z "$IMAGE_PATHS" ]; then
              echo "::error::image_generate returned no generated image paths"
              exit 1
            fi
            IMAGE_COUNT=0
            while IFS= read -r IMAGE_PATH; do
              case "$IMAGE_PATH" in
                "$GITHUB_WORKSPACE"/* | "$RUNNER_TEMP"/*) ;;
                *)
                  echo "::error::image_generate returned a path outside the runner workspace and temp directories"
                  exit 1
                  ;;
              esac
              case "$IMAGE_PATH" in
                *.png | *.jpg | *.jpeg | *.webp | *.gif) ;;
                *)
                  echo "::error::image_generate returned a path without a supported image extension"
                  exit 1
                  ;;
              esac
              if [ ! -f "$IMAGE_PATH" ]; then
                echo "::error::image_generate reported an image path that does not exist"
                exit 1
              fi
              IMAGE_COUNT=$((IMAGE_COUNT + 1))
            done <<<"$IMAGE_PATHS"
            echo "✓ Verified $IMAGE_COUNT image file(s) from the image_generate result."
          fi

          # Screenshot scenario: browser_analyze_screenshot captures the image
          # internally, sends it to the configured Kimi vision model, and returns
          # text to the DeepSeek main model. Assert the vision tool itself found
          # both deterministic markers.
          if [ "${{ matrix.assert_visual_analysis }}" = "true" ]; then
            if ! command -v jq >/dev/null 2>&1; then
              echo "::error::jq is required for the visual analysis assertion"
              exit 1
            fi
            if ! jq -e -s '
              any(.[];
                .type == "tool_execution_end"
                and .toolName == "browser_analyze_screenshot"
                and any((.result.content // [])[]?;
                  .type == "text"
                  and ((.text // "") | test("VISUAL CHECK 7391"; "i"))
                  and ((.text // "") | test("blue|#1457d9"; "i"))
                )
              )
            ' <<<"$output" >/dev/null; then
              echo "::error::browser_analyze_screenshot did not identify the fixture heading and color"
              exit 1
            fi
          fi

          # pi-goal: prove the goal engine actually ran and the task completed.
          #   1. [pi-goal] derived condition:  — derivation ran (hard gate;
          #      happens at before_agent_start, always before the run ends).
          #   2. [pi-goal] evaluation:         — evaluation ran (soft; the
          #      agent_end handler is async and print mode may exit first).
          #   3. the file the task asked for exists with the expected line —
          #      the real proof of completion. A filesystem check can't be
          #      self-matched by prompt/thinking echo the way a text token can.
          if [ "${{ matrix.extension }}" = "pi-goal" ]; then
            echo "--- pi-goal engine diagnostics ---"
            grep -E '\[pi-goal\] (derived condition|evaluation):' <<<"$output" || true
            if ! grep -qE '\[pi-goal\] derived condition:' <<<"$output"; then
              echo "::error::pi-goal: no 'derived condition' in output — auto-derivation did not run."
              exit 1
            fi
            if ! grep -qE '\[pi-goal\] evaluation: ok=' <<<"$output"; then
              echo "::warning::pi-goal: no 'evaluation' line — agent_end evaluation may not have completed before print-mode exit."
            fi
            GOAL_FILE=/tmp/pi-goal-ci.txt
            if [ ! -f "$GOAL_FILE" ] || ! grep -qiE '${{ matrix.assert_pattern }}' "$GOAL_FILE"; then
              echo "::error::pi-goal: $GOAL_FILE missing or missing expected line — the task the goal was derived from did not complete."
              rm -f "$GOAL_FILE"
              exit 1
            fi
            echo "✓ pi-goal wrote $GOAL_FILE and the goal engine derived+evaluated a condition."
            rm -f "$GOAL_FILE"
          fi

      - name: Verify Langfuse trace (pi-telemetry only)
        if: >
          matrix.extension == 'pi-telemetry' &&
          env.PI_INTEGRATION_BASE_URL != '' &&
          env.PI_INTEGRATION_API_KEY != ''
        # The verifier queries the known trace id directly; two minutes covers
        # the 90s ingestion deadline plus process startup.
        timeout-minutes: 2
        env:
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          TELEMETRY_SCENARIO: ${{ matrix.scenario || 'basic' }}
        run: |
          set -euo pipefail
          if [ -z "${LANGFUSE_PUBLIC_KEY:-}" ] || [ -z "${LANGFUSE_SECRET_KEY:-}" ]; then
            echo "::warning::LANGFUSE_* secrets unset — the Stage C run skipped too, nothing to verify."
            exit 0
          fi
          node .github/scripts/telemetry-langfuse-verify.mjs

      - name: Verify pi-memory-mem0 captured turn (mem0 jobs only)
        if: (matrix.extension == 'pi-memory' || matrix.extension == 'pi-memory-mem0') && env.PI_INTEGRATION_BASE_URL != ''
        run: |
          set -euo pipefail
          # pi-memory-mem0's passive side: its turn_end hook sends each
          # user+assistant turn to mem0 (embedded mode) for fact extraction,
          # and session_shutdown flushes the pending write before pi exits.
          # Vectors land in the SQLite path configured in settings.json
          # (oss.vectorStore.config.dbPath). Assertions:
          #   1. Vector db exists with non-trivial size
          #   2. `vectors` table exists (full OSS init succeeded)
          #   3. Passive capture persisted at least one extracted fact —
          #      extraction rewrites turn text, so no verbatim marker is
          #      asserted; the full dump below is the diagnostic.
          DB="${RUNNER_TEMP}/pi-mem0/mem0-vectors.db"
          if [ ! -f "$DB" ]; then
            echo "::error::mem0 vector db not created at $DB — mem0 OSS init failed."
            exit 1
          fi
          SIZE=$(stat -c%s "$DB" 2>/dev/null || stat -f%z "$DB")
          echo "Vector db size: $SIZE bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Vector db is suspiciously small ($SIZE bytes). mem0 likely failed before schema creation."
            exit 1
          fi
          if ! command -v sqlite3 >/dev/null 2>&1; then
            echo "::warning::sqlite3 CLI not present on runner; row-level assertions skipped."
            exit 0
          fi
          echo "--- mem0 vector tables ---"
          sqlite3 "$DB" '.tables'
          echo "--- mem0 vectors schema ---"
          sqlite3 "$DB" '.schema vectors'
          echo "--- mem0 stored memories (full dump) ---"
          sqlite3 -header -column "$DB" 'SELECT id, payload FROM vectors ORDER BY id;'
          ROWS=$(sqlite3 "$DB" 'SELECT COUNT(*) FROM vectors;')
          echo "Row count: $ROWS"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::mem0 vectors table is empty — the passive turn_end capture did not persist anything."
            exit 1
          fi
          # The prompt carries "my CI probe codeword is ci-mem0-alpha-7749" so
          # the extractor has an explicit preference-style fact to keep. Assert
          # the codeword survives extraction (paraphrase-tolerant prefix).
          if ! sqlite3 "$DB" 'SELECT payload FROM vectors;' | grep -qi 'ci-mem0'; then
            echo "::error::Expected 'ci-mem0' in extracted memories — extraction ran but dropped the codeword fact."
            exit 1
          fi
          echo "✓ mem0 OSS pipeline verified end-to-end."

      - name: Verify pi-memory mem0 vector dedup (mem0 jobs only)
        if: (matrix.extension == 'pi-memory' || matrix.extension == 'pi-memory-mem0') && env.PI_INTEGRATION_BASE_URL != '' && env.PI_INTEGRATION_API_KEY != ''
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            echo "::warning::sqlite3 CLI not present on runner; dedup row assertion skipped."
            exit 0
          fi

          DB="${RUNNER_TEMP}/pi-mem0/mem0-vectors.db"
          sqlite3 "$DB" <<'SQL'
          INSERT OR REPLACE INTO vectors (id, vector, payload) VALUES
            ('ci-dedup-1', zeroblob(6144), '{"user_id":"ci-integration","data":"ci-dedup-marker duplicate fact","updatedAt":"2026-07-15T00:00:00.000Z"}'),
            ('ci-dedup-2', zeroblob(6144), '{"user_id":"ci-integration","data":"ci-dedup-marker duplicate fact","updatedAt":"2026-07-15T00:00:01.000Z"}'),
            ('ci-retain-1', zeroblob(6144), '{"user_id":"ci-integration","data":"ci-retain-marker user likes black coffee","updatedAt":"2026-07-15T00:00:00.000Z"}'),
            ('ci-unique-1', zeroblob(6144), '{"user_id":"ci-integration","data":"ci-unique-marker user uses pnpm","updatedAt":"2026-07-15T00:00:00.000Z"}');
          SQL

          node --input-type=module <<'NODE'
          import { dedupMemories } from './packages/pi-memory-mem0/dist/dedup.js';

          const config = {
            mode: 'open-source',
            userId: 'ci-integration',
            oss: {
              disableHistory: true,
              vectorStore: {
                provider: 'memory',
                config: {
                  collectionName: 'pi_mem0',
                  dbPath: `${process.env.RUNNER_TEMP}/pi-mem0/mem0-vectors.db`,
                  dimension: 1536
                }
              },
              embedder: {
                provider: 'openai',
                config: {
                  model: 'text-embedding-v4',
                  baseURL: process.env.PI_INTEGRATION_BASE_URL,
                  apiKey: process.env.PI_INTEGRATION_API_KEY
                }
              },
              llm: {
                provider: 'openai',
                config: {
                  model: 'deepseek-v4-flash',
                  baseURL: process.env.PI_INTEGRATION_BASE_URL,
                  apiKey: process.env.PI_INTEGRATION_API_KEY
                }
              }
            }
          };

          const result = await dedupMemories({ userId: 'ci-integration', config });
          if (result.duplicatesRemoved < 1) {
            throw new Error(`Expected at least one duplicate removed, got ${JSON.stringify(result)}`);
          }
          NODE

          COUNT=$(sqlite3 "$DB" "SELECT COUNT(*) FROM vectors WHERE instr(payload, 'ci-dedup-marker duplicate fact') > 0;")
          echo "Dedup marker row count: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one dedup marker after provider deletion, got $COUNT"
            exit 1
          fi
          RETAIN_COUNT=$(sqlite3 "$DB" "SELECT COUNT(*) FROM vectors WHERE instr(payload, 'ci-retain-marker user likes black coffee') > 0;")
          echo "Retain marker row count: $RETAIN_COUNT"
          if [ "$RETAIN_COUNT" -ne 1 ]; then
            echo "::error::Expected retain marker to survive dedup, got $RETAIN_COUNT"
            exit 1
          fi
          UNIQUE_COUNT=$(sqlite3 "$DB" "SELECT COUNT(*) FROM vectors WHERE instr(payload, 'ci-unique-marker user uses pnpm') > 0;")
          echo "Unique marker row count: $UNIQUE_COUNT"
          if [ "$UNIQUE_COUNT" -ne 1 ]; then
            echo "::error::Expected unique marker to survive dedup, got $UNIQUE_COUNT"
            exit 1
          fi
          echo "✓ pi-memory mem0 vector dedup verification passed."

      - name: Skipped (secrets unavailable)
        if: >
          matrix.extension != 'pi-video-gen' &&
          (env.PI_INTEGRATION_BASE_URL == '' || env.PI_INTEGRATION_API_KEY == '')
        run: |
          echo "::warning::PI_INTEGRATION_* secrets unset — skipping Stage C ${{ matrix.extension }}."
