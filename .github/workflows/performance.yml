name: Performance

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: Sustained offline load per revision (baseline and candidate run sequentially)
        type: choice
        options: ['0', '60', '120']
        default: '0'
  schedule:
    - cron: '17 18 * * 6'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  performance:
    if: github.event_name != 'schedule'
    name: Performance regression (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, sessions, profiles]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
      - name: Check benchmark regression detection
        run: node tests/performance/runtime.mjs --self-test
      - name: Build baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/pi-performance-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/pi-performance-base"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build candidate
        run: pnpm build
      - name: Measure and compare runtime performance
        run: node tests/performance/runtime.mjs "$RUNNER_TEMP/pi-performance-base" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/performance" "${{ matrix.suite }}"
      - name: Publish report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/performance/report.md" ]; then
            cat "$RUNNER_TEMP/performance/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results-${{ matrix.suite }}
          path: ${{ runner.temp }}/performance/
          if-no-files-found: warn
          retention-days: 14

  performance-checks:
    name: Performance checks
    if: always() && github.event_name != 'schedule'
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - name: Require every engineering suite to pass
        env:
          RESULT: ${{ needs.performance.result }}
        run: test "$RESULT" = success

  soak:
    name: Sustained offline resource growth
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      BASE_SHA: ${{ github.event.before || format('{0}^', github.sha) }}
      SOAK_MINUTES: ${{ github.event_name == 'schedule' && '60' || inputs.soak_minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pi-build
      - name: Build baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/pi-performance-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/pi-performance-base"
          pnpm install --frozen-lockfile
          pnpm build
      - name: Compare sustained engineering load
        run: node tests/performance/runtime.mjs "$RUNNER_TEMP/pi-performance-base" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/performance-soak" soak "$SOAK_MINUTES"
      - name: Publish sustained-load report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/performance-soak/report.md" ]; then
            cat "$RUNNER_TEMP/performance-soak/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-soak
          path: ${{ runner.temp }}/performance-soak/
          if-no-files-found: warn
          retention-days: 90
