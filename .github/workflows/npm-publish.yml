name: Publish npm Packages

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag to publish with
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      release_version:
        description: npm version to publish, or auto to compute the next version
        required: true
        default: auto
        type: string
permissions:
  contents: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Run JavaScript actions (checkout, setup-node, pnpm/action-setup, etc.) on
  # Node 24 instead of the deprecated Node 20 the runner ships by default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-video-ffmpeg:
    name: build pi-video-gen FFmpeg (${{ matrix.target }})
    strategy:
      matrix:
        include:
          # darwin targets need macOS hosts; linux-* targets keep the pinned
          # ubuntu-22.04 image for the published glibc baseline. win32-x64
          # produces PE binaries via mingw (host-glibc-agnostic), so it runs
          # on the accelerated self-hosted runner for reliable source
          # downloads (ffmpeg.org, zlib.net, code.videolan.org).
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04
          - target: win32-x64
            runner: [instance-hnpsq9go, linux, x64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          case "${{ matrix.target }}" in
            darwin-*)
              brew install nasm pkg-config
              ;;
            linux-x64)
              sudo apt-get update
              sudo apt-get install -y nasm pkg-config
              ;;
            linux-arm64)
              sudo apt-get update
              sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config qemu-user
              ;;
            win32-x64)
              sudo apt-get update
              sudo apt-get install -y gcc-mingw-w64-x86-64 nasm pkg-config wine64
              ;;
          esac

      - name: Build minimal LGPL FFmpeg
        run: packages/pi-video-gen/scripts/build-ffmpeg.sh "${{ matrix.target }}"

      - name: Build GPL FFmpeg variant (x264 for h264)
        run: GPL_VARIANT=1 packages/pi-video-gen/scripts/build-ffmpeg.sh "${{ matrix.target }}"

      - name: Verify FFmpeg binary
        shell: bash
        run: |
          bin="packages/pi-video-gen/platforms/ffmpeg-${{ matrix.target }}/bin/ffmpeg"
          gpl="packages/pi-video-gen/platforms/ffmpeg-${{ matrix.target }}/bin/ffmpeg-gpl"
          probe="${bin%/*}/ffprobe"
          gpl_probe="${gpl%/*}/ffprobe-gpl"
          run_ffmpeg() {
            executable="$1"
            shift
            case "${{ matrix.target }}" in
              darwin-*|linux-x64) "$executable" "$@" ;;
              linux-arm64) qemu-aarch64 -L /usr/aarch64-linux-gnu "$executable" "$@" ;;
              win32-x64) WINEDEBUG=-all /usr/lib/wine/wine64 "${executable}.exe" "$@" ;;
            esac
          }
          case "${{ matrix.target }}" in
            darwin-*)
              "$bin" -version
              "$probe" -version
              "$gpl" -version
              "$gpl_probe" -version
              xcrun vtool -show-build "$bin" | grep -q 'minos 11.0'
              ;;
            linux-x64)
              "$bin" -version
              "$probe" -version
              "$gpl" -version
              "$gpl_probe" -version
              ldd "$bin"
              ;;
            linux-arm64)
              qemu-aarch64 -L /usr/aarch64-linux-gnu "$bin" -version
              qemu-aarch64 -L /usr/aarch64-linux-gnu "$probe" -version
              qemu-aarch64 -L /usr/aarch64-linux-gnu "$gpl" -version
              qemu-aarch64 -L /usr/aarch64-linux-gnu "$gpl_probe" -version
              aarch64-linux-gnu-readelf -h "$bin" | grep -q 'AArch64'
              ;;
            win32-x64)
              WINEDEBUG=-all /usr/lib/wine/wine64 "${bin}.exe" -version
              WINEDEBUG=-all /usr/lib/wine/wine64 "${probe}.exe" -version
              WINEDEBUG=-all /usr/lib/wine/wine64 "${gpl}.exe" -version
              WINEDEBUG=-all /usr/lib/wine/wine64 "${gpl_probe}.exe" -version
              x86_64-w64-mingw32-objdump -f "${bin}.exe" | grep -q 'pei-x86-64'
              ;;
          esac
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("timeline-smoke.jpg").write_bytes(base64.b64decode(
              ""
          ))
          Path("timeline-smoke.srt").write_text(
              "1\n00:00:00,000 --> 00:00:00,500\nTimeline smoke\n",
              encoding="utf-8",
          )
          PY
          smoke_args=(
            -loop 1 -framerate 25 -t 0.5 -i timeline-smoke.jpg
            -loop 1 -framerate 25 -t 0.5 -i timeline-smoke.jpg
            -loop 1 -framerate 25 -t 0.5 -i packages/pi-video-gen/preview.png
            -f lavfi -i anullsrc=r=48000:cl=stereo
            -f lavfi -i anullsrc=r=48000:cl=stereo
            -f lavfi -i sine=frequency=440:sample_rate=48000
            -i timeline-smoke.srt
            -filter_complex "
              [0:v]scale=64:64,zoompan=z='min(zoom+0.001,1.1)':d=1:s=64x64:fps=25,settb=AVTB[v0];
              [1:v]scale=64:64,settb=AVTB[v1];
              [2:v]scale=16:16,format=rgba[ovr];
              [v0][ovr]overlay=0:0:shortest=1[vo];
              [vo][v1]xfade=transition=fade:duration=0.1:offset=0.4[v];
              [3:a]atrim=0:0.25[a0];
              [4:a]atrim=0:0.25[a1];
              [a0][a1]concat=n=2:v=0:a=1[voice];
              [5:a]atrim=0:0.5[bgm];
              [voice][bgm]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95:level=false[a]"
            -map "[v]" -map "[a]" -map 6:s
            -t 0.8 -c:a aac -c:s mov_text -y
          )
          run_ffmpeg "$bin" "${smoke_args[@]}" -c:v mpeg4 \
            "timeline-smoke-${{ matrix.target }}.mp4"
          run_ffmpeg "$gpl" "${smoke_args[@]}" -c:v libx264 \
            "timeline-smoke-${{ matrix.target }}-h264.mp4"
          run_ffmpeg "$bin" \
            -ss 0.1 -t 0.3 -i "timeline-smoke-${{ matrix.target }}.mp4" \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -filter_complex "
              [0:v]scale=64:64:force_original_aspect_ratio=increase,crop=64:64,fps=25[v];
              [0:a]volume=0.5[src];
              [src][1:a]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95:level=false[a]" \
            -map "[v]" -map "[a]" -t 0.3 -c:v mpeg4 -c:a aac -y \
            "mixed-media-smoke-${{ matrix.target }}.mp4"
          run_ffmpeg "$bin" -ss 0.2 \
            -i "mixed-media-smoke-${{ matrix.target }}.mp4" \
            -frames:v 1 -y timeline-smoke-qc.png

      - name: Preserve executable permissions
        run: |
          tar -czf "pi-video-gen-ffmpeg-${{ matrix.target }}.tar.gz" \
            -C "packages/pi-video-gen/platforms/ffmpeg-${{ matrix.target }}" \
            bin LICENSE GPLv2.txt ZLIB_LICENSE.txt SOURCE.md source

      - name: Upload platform package payload
        uses: actions/upload-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-${{ matrix.target }}
          path: pi-video-gen-ffmpeg-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish packages
    needs: build-video-ffmpeg
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    timeout-minutes: 45
    outputs:
      publish_filters: ${{ steps.versioning.outputs.publish_filters }}
      release_version: ${{ steps.versioning.outputs.release_version }}
    env:
      GIT_ACTOR: ${{ github.actor }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download darwin-arm64 FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-darwin-arm64
          path: .release-artifacts/darwin-arm64

      - name: Download darwin-x64 FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-darwin-x64
          path: .release-artifacts/darwin-x64

      - name: Download linux-arm64 FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-linux-arm64
          path: .release-artifacts/linux-arm64

      - name: Download linux-x64 FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-linux-x64
          path: .release-artifacts/linux-x64

      - name: Download win32-x64 FFmpeg
        uses: actions/download-artifact@v4
        with:
          name: pi-video-gen-ffmpeg-win32-x64
          path: .release-artifacts/win32-x64

      - name: Prepare FFmpeg platform packages
        run: |
          tar -xzf .release-artifacts/darwin-arm64/pi-video-gen-ffmpeg-darwin-arm64.tar.gz \
            -C packages/pi-video-gen/platforms/ffmpeg-darwin-arm64
          tar -xzf .release-artifacts/darwin-x64/pi-video-gen-ffmpeg-darwin-x64.tar.gz \
            -C packages/pi-video-gen/platforms/ffmpeg-darwin-x64
          tar -xzf .release-artifacts/linux-arm64/pi-video-gen-ffmpeg-linux-arm64.tar.gz \
            -C packages/pi-video-gen/platforms/ffmpeg-linux-arm64
          tar -xzf .release-artifacts/linux-x64/pi-video-gen-ffmpeg-linux-x64.tar.gz \
            -C packages/pi-video-gen/platforms/ffmpeg-linux-x64
          tar -xzf .release-artifacts/win32-x64/pi-video-gen-ffmpeg-win32-x64.tar.gz \
            -C packages/pi-video-gen/platforms/ffmpeg-win32-x64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        run: corepack install -g pnpm@10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Ensure release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "master" ]; then
            echo "Publishing is only allowed from the master branch."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "$GIT_ACTOR"
          git config user.email "${GIT_ACTOR}@users.noreply.github.com"

      - name: Resolve monorepo release version
        id: versioning
        env:
          RELEASE_CHANNEL: ${{ inputs.npm_tag }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");

          const channel = process.env.RELEASE_CHANNEL;
          const versionInput = (process.env.RELEASE_VERSION_INPUT || "auto").trim();
          if (!channel) {
            throw new Error("RELEASE_CHANNEL is required");
          }
          if (channel !== "beta" && channel !== "latest") {
            throw new Error(`Unsupported release channel: ${channel}`);
          }

          const rootPackageFile = path.join(process.cwd(), "package.json");
          const packagesDir = path.join(process.cwd(), "packages");
          const topLevelPackageFiles = fs.readdirSync(packagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(packagesDir, entry.name, "package.json"))
            .filter((file) => fs.existsSync(file));
          const platformPackagesDir = path.join(packagesDir, "pi-video-gen", "platforms");
          const platformPackageFiles = fs.readdirSync(platformPackagesDir, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(platformPackagesDir, entry.name, "package.json"))
            .filter((file) => fs.existsSync(file));
          const packageFiles = [...topLevelPackageFiles, ...platformPackageFiles];

          const packages = packageFiles.map((file) => ({
            file,
            pkg: JSON.parse(fs.readFileSync(file, "utf8")),
          }));
          const publishablePackages = packages.filter(({ pkg }) => !pkg.private);
          const publishedPackages = publishablePackages.map(({ pkg }) => pkg.name);
          if (publishablePackages.length === 0) {
            throw new Error("No publishable packages found.");
          }

          const parseVersion = (version) => {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/);
            if (!match) {
              throw new Error(`Unsupported version format: ${version}`);
            }
            return {
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              beta: match[4] === undefined ? null : Number(match[4]),
            };
          };
          const formatBaseVersion = (version) => `${version.major}.${version.minor}.${version.patch}`;
          const formatVersion = (version) => {
            const baseVersion = formatBaseVersion(version);
            return version.beta === null ? baseVersion : `${baseVersion}-beta.${version.beta}`;
          };
          const compareVersions = (left, right) => {
            for (const part of ["major", "minor", "patch"]) {
              if (left[part] !== right[part]) {
                return left[part] - right[part];
              }
            }
            if (left.beta === right.beta) return 0;
            if (left.beta === null) return 1;
            if (right.beta === null) return -1;
            return left.beta - right.beta;
          };
          const maxVersion = (versions) =>
            versions.reduce((highest, version) =>
              highest === null || compareVersions(version, highest) > 0 ? version : highest,
              null
            );
          const writePackageVersion = (file, version) => {
            const source = fs.readFileSync(file, "utf8");
            const versionFieldPattern = /"version"\s*:\s*"[^"]+"/;
            if (!versionFieldPattern.test(source)) {
              throw new Error(`Could not update version field in ${file}`);
            }
            const nextSource = source.replace(versionFieldPattern, `"version": "${version}"`);
            if (nextSource !== source) {
              fs.writeFileSync(file, nextSource);
            }
          };

          const npmViewJson = (packageName, field) => {
            try {
              const output = execFileSync("npm", ["view", packageName, field, "--json"], {
                encoding: "utf8",
                stdio: ["ignore", "pipe", "pipe"],
              }).trim();
              return output ? JSON.parse(output) : {};
            } catch (error) {
              const stderr = error.stderr?.toString?.() ?? "";
              if (stderr.includes("E404")) {
                return null;
              }
              throw new Error(`Failed to read npm ${field} for ${packageName}: ${stderr || error.message}`);
            }
          };
          const normalizeVersions = (versions) => {
            if (versions === null) return null;
            if (Array.isArray(versions)) return versions;
            if (typeof versions === "string") return [versions];
            return [];
          };

          const remoteInfos = publishedPackages.map((packageName) => ({
            packageName,
            versions: normalizeVersions(npmViewJson(packageName, "versions")),
          }));
          const isFullyPublished = (version) => remoteInfos.every((info) => info.versions?.includes(version));
          const publishedVersions = remoteInfos
            .flatMap((info) => info.versions ?? [])
            .map((version) => {
              try {
                return parseVersion(version);
              } catch {
                return null;
              }
            })
            .filter((version) => version !== null);

          const computeNextBetaVersion = () => {
            const highestBeta = maxVersion(publishedVersions.filter((version) => version.beta !== null));
            if (highestBeta === null) {
              throw new Error(
                "Cannot auto-publish a beta release because npm has no published beta versions. Provide release_version."
              );
            }

            const highestBetaVersion = formatVersion(highestBeta);
            if (!isFullyPublished(highestBetaVersion)) {
              return highestBetaVersion;
            }

            return formatVersion({ ...highestBeta, beta: highestBeta.beta + 1 });
          };
          const computeLatestVersion = () => {
            const highestStable = maxVersion(publishedVersions.filter((version) => version.beta === null));
            if (highestStable === null) {
              throw new Error(
                "Cannot auto-publish with the latest dist-tag because npm has no published stable versions. Provide release_version."
              );
            }

            const highestStableVersion = formatVersion(highestStable);
            if (isFullyPublished(highestStableVersion)) {
              throw new Error(
                `${highestStableVersion} is already published for every package. Provide a stable release_version.`
              );
            }
            return highestStableVersion;
          };
          const computeNextVersion = () => {
            if (versionInput !== "" && versionInput !== "auto") {
              const parsedInputVersion = parseVersion(versionInput);
              if (channel === "beta" && parsedInputVersion.beta === null) {
                throw new Error(`Beta releases must use a beta version, received ${versionInput}`);
              }
              if (channel === "latest" && parsedInputVersion.beta !== null) {
                throw new Error(`Latest releases must use a stable version, received ${versionInput}`);
              }
              return versionInput;
            }

            if (channel === "beta") {
              return computeNextBetaVersion();
            }

            return computeLatestVersion();
          };

          const nextVersion = computeNextVersion();
          writePackageVersion(rootPackageFile, nextVersion);
          for (const { file } of packages) {
            writePackageVersion(file, nextVersion);
          }

          const packagesToPublish = remoteInfos
            .filter((info) => !info.versions?.includes(nextVersion))
            .map((info) => info.packageName);

          console.log(`monorepo release version: ${nextVersion}`);
          console.log(`requested release version: ${versionInput || "auto"}`);
          console.log("release version source: npm published package versions");
          console.log("package.json versions are updated only in this workflow workspace and are not committed");
          console.log(`packages to publish: ${packagesToPublish.length > 0 ? packagesToPublish.join(", ") : "(none)"}`);
          if (packagesToPublish.length === 0) {
            throw new Error(
              `No packages can be published for ${nextVersion}; choose a new release_version before running the release workflow.`
            );
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_version=${nextVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip_publish=false\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish_filters=${packagesToPublish.join(" ")}\n`);
          EOF

      - name: Run checks
        run: pnpm run pr-check

      - name: Publish to npm
        if: steps.versioning.outputs.skip_publish != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_cmd=(pnpm publish -r --access public --no-git-checks)
          for package_name in ${{ steps.versioning.outputs.publish_filters }}; do
            publish_cmd+=(--filter "$package_name")
          done
          if [ "${{ inputs.npm_tag }}" = "beta" ]; then
            publish_cmd+=(--tag beta)
          fi
          "${publish_cmd[@]}"

      - name: Tag release
        env:
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
        run: |
          tag_name="v${RELEASE_VERSION}"
          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "Tag ${tag_name} already exists locally."
          else
            git tag -a "${tag_name}" -m "${tag_name}"
          fi
          git push origin "refs/tags/${tag_name}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
          RELEASE_CHANNEL: ${{ inputs.npm_tag }}
        run: |
          tag_name="v${RELEASE_VERSION}"
          if gh release view "${tag_name}" >/dev/null 2>&1; then
            echo "GitHub release ${tag_name} already exists."
            exit 0
          fi
          gh release create "${tag_name}" \
            --verify-tag \
            --title "v${RELEASE_VERSION}" \
            --notes "Published npm packages with dist-tag \`${RELEASE_CHANNEL}\`."

  notify-feishu:
    name: notify feishu
    needs: publish
    if: needs.publish.result == 'success'
    runs-on:
      - instance-hnpsq9go
      - linux
      - x64
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Post message
        env:
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          INPUT_ACTOR: ${{ github.actor }}
          INPUT_PACKAGE_FILTERS: ${{ needs.publish.outputs.publish_filters }}
          INPUT_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_CHANNEL: ${{ inputs.npm_tag }}
          INPUT_RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_RUN_ATTEMPT: ${{ github.run_attempt }}
          INPUT_RUN_ID: ${{ github.run_id }}
          INPUT_SERVER_URL: ${{ github.server_url }}
          INPUT_SHA: ${{ github.sha }}
          INPUT_WORKFLOW_NAME: ${{ github.workflow }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FEISHU_WEBHOOK_URL}" ]; then
            echo "FEISHU_WEBHOOK_URL repository secret is not configured."
            exit 1
          fi

          payload_file="$(mktemp)"

          node <<'NODE' > "${payload_file}"
          const crypto = require('node:crypto');

          const actorMentionMap = {
            'CheshireJCat': 'ou_8746046faa28114c556e9ad62c6e356c',
            'Weaxs': 'ou_994c42003f423b71369ae44630f5ed3d',
            'liushuang216': 'ou_e8b6aca2e27c4cc19c63736d2b7d2573',
            '2betop': 'ou_20679b90d350f87842db10ac3fc9198c',
            'hsm-lv': 'ou_50b260a2a6f729c2f06e6969e4b4e3f9',
            'LureXudzhang': 'ou_0eeb98d8a39e1bda9c17bb1d85a91225',
            'ForLcy': 'ou_174bbc2885c7a61ee514c386dd3b6df1',
            'nanxing137': 'ou_11b2a4e43d0acefac59049e35cac4bef',
            'pcdqc': 'ou_eb13b0a834f22a4be461a6ef7594a8fb'
          };

          const sha = process.env.INPUT_SHA || '';
          const shortSha = sha.slice(0, 7) || '-';
          const repo = process.env.INPUT_REPOSITORY;
          const serverUrl = process.env.INPUT_SERVER_URL || 'https://github.com';
          const runId = process.env.INPUT_RUN_ID;
          const runAttempt = process.env.INPUT_RUN_ATTEMPT || '1';
          const actor = process.env.INPUT_ACTOR || '-';
          const actorOpenId = actorMentionMap[actor];
          const actorLine = actorOpenId
            ? `**触发人**\n<at id="${actorOpenId}"></at>`
            : `**触发人**\n${actor}`;
          const refName = process.env.INPUT_REF_NAME || '-';
          const releaseChannel = process.env.INPUT_RELEASE_CHANNEL || '-';
          const releaseVersion = process.env.INPUT_RELEASE_VERSION || '-';
          const packageFilters = (process.env.INPUT_PACKAGE_FILTERS || '')
            .split(/\s+/)
            .map((item) => item.trim())
            .filter(Boolean);
          const packageList = packageFilters.length > 0
            ? packageFilters.map((item) => `- \`${item}\``).join('\n')
            : '-';
          const timestamp = Math.floor(Date.now() / 1000).toString();
          const webhookSecret = process.env.FEISHU_WEBHOOK_SECRET || '';
          const repoUrl = `${serverUrl}/${repo}`;
          const runUrl = `${serverUrl}/${repo}/actions/runs/${runId}/attempts/${runAttempt}`;
          const releaseUrl = `${serverUrl}/${repo}/releases/tag/v${releaseVersion}`;

          const body = {
            msg_type: 'interactive',
            card: {
              schema: '2.0',
              config: {
                wide_screen_mode: true,
              },
              header: {
                template: 'green',
                title: {
                  tag: 'plain_text',
                  content: `${repo} npm 发布成功`,
                },
                subtitle: {
                  tag: 'plain_text',
                  content: `版本: v${releaseVersion} (${releaseChannel})`,
                },
