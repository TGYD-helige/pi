name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-checks:
    name: build checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Isolate temporary files
        run: |
          job_tmp="$RUNNER_TEMP/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pr-check"
          mkdir -p "$job_tmp"
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup pi build environment
        uses: ./.github/actions/setup-pi-build
        with:
          build: 'false'
          install-video-tools: 'true'
          prebuild-better-sqlite3: 'true'

      - name: PR Check
        run: pnpm run pr-check
