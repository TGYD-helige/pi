name: Setup pi build environment
description: >
  Shared setup steps for every pi monorepo CI job: per-job pi config dir,
  pnpm + Node 24, install deps (with optional better-sqlite3 prebuilt fetch),
  and build the workspace. Optionally installs pi-coding-agent globally and
  exposes a per-job PI_CODING_AGENT_DIR.

inputs:
  install-pi-cli:
    description: When 'true', `npm i -g @earendil-works/pi-coding-agent` after build.
    required: false
    default: 'false'
  prebuild-better-sqlite3:
    description: >
      When 'true', force-fetch the better-sqlite3 prebuilt binary after install.
      pnpm 10's onlyBuiltDependencies allowlist only fires on first install,
      so cache restores leave native modules without their .node binding.
      pi-memory-mem0's OSS sqlite store needs this.
    required: false
    default: 'false'
  install-video-tools:
    description: >
      When 'true', expose ffmpeg-static plus a pinned ffprobe on PATH for
      pi-video-gen tests and local composition E2E.
    required: false
    default: 'false'
  set-pi-agent-dir:
    description: >
      When 'true', point PI_CODING_AGENT_DIR at $RUNNER_TEMP/pi-agent so the
      job's pi state stays isolated under the per-job temp dir. Sets up the
      dir clean.
    required: false
    default: 'false'
  build:
    description: >
      When 'true', runs `pnpm --filter @amaster.ai/pi-storage prisma:generate`
      followed by `pnpm build`. When 'false' the action stops after install,
      and the caller can choose to run a narrower build (e.g. `pnpm typecheck`
      doesn't need a full build).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up per-job pi config dir
      if: inputs.set-pi-agent-dir == 'true'
      shell: bash
      run: |
        # RUNNER_TEMP is per-job. `env:` blocks can't reference `runner.temp`
        # at job-startup time, so we resolve via $RUNNER_TEMP at step time and
        # persist via $GITHUB_ENV.
        echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"

    - name: Reset per-job pi config dir
      if: inputs.set-pi-agent-dir == 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/pi-agent" || true
        mkdir -p "$RUNNER_TEMP/pi-agent"

    # Note: callers are responsible for `actions/checkout@v7` before invoking
    # this composite — GitHub needs to find action.yml on disk first.

    # Node must come before pnpm: v6's npm-based bootstrap (@pnpm/exe
    # postinstall uses import.meta.dirname) needs Node >= 20.11.
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    # cache: false — every job runs on a fresh hosted runner, so there is no
    # persisted store to reuse and no cache upload/download is configured.
    # `dest` keeps the pnpm bootstrap inside the per-job temp dir.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        cache: false
        dest: ${{ runner.temp }}/setup-pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup FFmpeg test runtime
      if: inputs.install-video-tools == 'true'
      shell: bash
      run: |
        set -euo pipefail
        VIDEO_TOOLS_ROOT="$RUNNER_TEMP/pi-video-tools"
        FFPROBE_ROOT="$VIDEO_TOOLS_ROOT/ffprobe-package"
        BIN_DIR="$VIDEO_TOOLS_ROOT/bin"
        mkdir -p "$BIN_DIR"
        npm install \
          --prefix "$FFPROBE_ROOT" \
          --no-package-lock \
          --no-save \
          --ignore-scripts \
          @ffprobe-installer/ffprobe@2.1.2
        FFMPEG_BIN="$(
          node --input-type=module -e "
            import { createRequire } from 'node:module';
            process.stdout.write(
              createRequire(new URL('./packages/pi-video-gen/package.json', import.meta.url))(
                'ffmpeg-static',
              ),
            );
          "
        )"
        FFPROBE_BIN="$(
          FFPROBE_ROOT="$FFPROBE_ROOT" node -e "
            process.stdout.write(
              require(
                process.env.FFPROBE_ROOT + '/node_modules/@ffprobe-installer/ffprobe'
              ).path,
            );
          "
        )"
        chmod 0755 "$FFMPEG_BIN" "$FFPROBE_BIN"
        ln -sf "$FFMPEG_BIN" "$BIN_DIR/ffmpeg"
        ln -sf "$FFPROBE_BIN" "$BIN_DIR/ffprobe"
        "$BIN_DIR/ffmpeg" -version
        "$BIN_DIR/ffprobe" -version
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - name: Force-fetch better-sqlite3 prebuilt binary
      if: inputs.prebuild-better-sqlite3 == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # pnpm 10 gates build scripts behind an allowlist; cache restore can
        # short-circuit the install's build phase, leaving better-sqlite3
        # without its native .node binding. Fetching the prebuilt binary
        # directly is cheap (~10s) and idempotent.
        (cd node_modules/.pnpm/better-sqlite3@*/node_modules/better-sqlite3 \
          && npx --no-install prebuild-install) || true

    - name: Build packages
      if: inputs.build == 'true'
      shell: bash
      run: |
        pnpm --filter @amaster.ai/pi-storage prisma:generate
        pnpm build

    - name: Install pi-coding-agent
      if: inputs.install-pi-cli == 'true'
      shell: bash
      run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent
