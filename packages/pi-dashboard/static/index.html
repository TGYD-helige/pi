<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack.min.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <main class="dashboard-shell">
      <header class="dashboard-topbar">
        <div class="dashboard-title">
          <strong id="dashboardTitle">数据大屏</strong>
        </div>
        <div class="dashboard-actions">
          <div class="dashboard-action-tools">
            <button type="button" id="addModuleButton" class="icon-button" aria-label="添加模块" title="添加模块">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14" />
                <path d="M5 12h14" />
              </svg>
            </button>
            <select id="themePresetSelect" class="theme-preset-select" aria-label="切换主题" title="切换主题" disabled></select>
            <button type="button" id="themeModeButton" class="icon-button" aria-label="切换为浅色" title="切换为浅色">
              <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2" />
                <path d="M12 20v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="m17.66 17.66 1.41 1.41" />
                <path d="M2 12h2" />
                <path d="M20 12h2" />
                <path d="m6.34 17.66-1.41 1.41" />
                <path d="m19.07 4.93-1.41 1.41" />
              </svg>
              <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.99 12.35A9 9 0 1 1 11.65 3a7 7 0 0 0 9.34 9.35Z" />
              </svg>
            </button>
            <button type="button" id="reloadButton" class="icon-button" aria-label="刷新" title="刷新">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12a9 9 0 0 1-9 9 9.8 9.8 0 0 1-6.74-2.74L3 16" />
                <path d="M3 21v-5h5" />
                <path d="M3 12a9 9 0 0 1 9-9 9.8 9.8 0 0 1 6.74 2.74L21 8" />
                <path d="M16 8h5V3" />
              </svg>
            </button>
          </div>
          <div class="dashboard-edit-tools">
            <button type="button" id="undoLayoutButton" class="edit-icon-button" aria-label="撤销" title="撤销" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 14 4 9l5-5" />
                <path d="M5 9h9a6 6 0 0 1 0 12h-2" />
              </svg>
            </button>
            <button type="button" id="redoLayoutButton" class="edit-icon-button" aria-label="重做" title="重做" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 14 5-5-5-5" />
                <path d="M19 9h-9a6 6 0 0 0 0 12h2" />
              </svg>
            </button>
            <button type="button" id="autoArrangeButton" class="edit-icon-button" aria-label="自动排列" title="自动排列">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="6" height="6" rx="1.5" />
                <rect x="14" y="4" width="6" height="6" rx="1.5" />
                <rect x="4" y="14" width="6" height="6" rx="1.5" />
                <path d="M14 17h6" />
                <path d="M17 14v6" />
              </svg>
            </button>
            <button type="button" id="completeEditButton" class="edit-icon-button complete-edit-button" aria-label="完成编辑" title="完成编辑">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m5 12 4 4L19 6" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <section id="errorBanner" class="error-banner" hidden></section>
      <section id="grid" class="grid-stack dashboard-grid"></section>
    </main>

    <dialog id="moduleDialog" class="module-dialog">
      <form method="dialog" id="moduleForm">
        <header>
          <strong id="moduleDialogTitle">添加模块</strong>
          <button type="button" id="closeModuleDialogButton" aria-label="关闭">×</button>
        </header>
        <label>
          标题
          <input name="title" required maxlength="60" />
        </label>
        <label>
          类型
          <select name="type">
            <option value="metric">指标</option>
            <option value="chart">图表</option>
            <option value="table">表格</option>
            <option value="text">文本</option>
          </select>
        </label>
        <label>
          数据源
          <select name="dataSourceId"></select>
        </label>
        <label>
          数据路径 / 文本
          <input name="path" placeholder="例如 revenue、table、series，文本模块可直接写内容" />
        </label>
        <footer>
          <button type="submit" value="save">保存</button>
        </footer>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack-all.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
